<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Santoro/Longobardi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6ee; --card:#ffffff; --ink:#2b2633; --muted:#8a8194; --line:#f1e4d8;
  --primary:#ff6b57; --primary-soft:#ffe3dd; --accent:#12b5a5; --accent-soft:#d6f5f1;
  --warn:#f59e0b; --warn-soft:#fff1d6; --danger:#e8453c; --danger-soft:#ffe0de;
  --ok:#1fa971; --ok-soft:#dbf5e9; --shadow:0 6px 20px rgba(120,70,40,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1a21; --card:#28252e; --ink:#f4f0f7; --muted:#a69db1; --line:#39343f;
    --primary-soft:#4a2b28; --accent-soft:#1d3d3a; --warn-soft:#45371c; --danger-soft:#4a2526; --ok-soft:#1e3d30;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px}
header .wrap{display:flex;align-items:center;gap:10px}
header h1{font-size:22px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px}
header h1 span{color:var(--primary)}
header h1 em{font-style:normal;color:var(--accent)}
@media (max-width:480px){header h1{font-size:17px;letter-spacing:-.4px}header .icon-btn{width:38px;height:38px;font-size:17px}}
.icon-btn{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:19px;display:grid;place-items:center}
.demo{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14px;margin:4px 0 12px}

nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;
  display:flex;gap:4px;background:var(--card);padding:6px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:min(520px,calc(100% - 24px))}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:16px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button b{font-size:21px;line-height:1}
nav.tabs button.on{background:var(--primary-soft);color:var(--primary)}
.fab{position:fixed;right:max(16px,calc(50% - 474px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:29;width:58px;height:58px;border-radius:20px;border:0;
  background:var(--primary);color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(255,107,87,.45);cursor:pointer}

h2{font-size:19px;margin:22px 0 10px;font-weight:800}
.hello{font-size:26px;font-weight:800;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 6px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-orange{background:var(--warn-soft);color:#c27400}
.b-green{background:var(--ok-soft);color:var(--ok)}
.b-grey{background:var(--line);color:var(--muted)}
.b-teal{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.spadd{display:flex;gap:8px;align-items:center}
.spadd .in{flex:1;min-width:0}
.spadd .qta{flex:0 0 96px}
.sp-rep{font-weight:800;font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sp-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.sp-row:last-child{border-bottom:0}
.sp-row .txt{flex:1;min-width:0}
.sp-row .t{font-weight:700;font-size:17px}
.sp-row .s{font-size:13px;color:var(--muted)}
.check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--accent);display:grid;place-items:center;flex:none;font-weight:900;color:#fff}
.sp-row.fatto .check{background:var(--accent)}
.sp-row.fatto .t{text-decoration:line-through;color:var(--muted)}
.qtab{background:var(--warn-soft);color:#b45309;border-radius:8px;padding:1px 7px;font-size:13px;font-weight:800;margin-left:4px}
.presi{opacity:.85}
.sp-row.spento .t{color:var(--muted)}
.sp-row .check.on{background:var(--accent)}
.dubbio{color:#b45309!important}
ol.passi{padding-left:20px;margin:6px 0 10px}
ol.passi li{margin-bottom:6px}
.barra{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;border-radius:9px}
.prog{cursor:pointer;margin:0}
.prog.chiuso{opacity:.7}
.prog-top{display:flex;gap:12px;align-items:center}
.prog-top .t{font-weight:800;font-size:17px}
.emerg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.emerg a{display:flex;flex-direction:column;align-items:center;background:var(--danger-soft);color:var(--danger);border-radius:14px;padding:10px 6px;text-decoration:none}
.emerg a b{font-size:18px}
.emerg a span{font-size:12px;font-weight:700}
.row.num{align-items:flex-start}
.azn{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.azn a{text-decoration:none}
.share{background:var(--accent-soft);border-radius:14px;padding:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
@media (max-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tiles button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:14px}
.tiles button b{font-size:26px}
.tiles button small{font-weight:600;color:var(--muted);font-size:12px;text-align:center}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--primary);color:#fff}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.teal{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{border:0;border-radius:999px;padding:7px 14px;background:var(--card);box-shadow:var(--shadow);font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.search{width:100%;border:0;border-radius:16px;padding:12px 16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px}

/* Calendario */
.calhead{display:flex;align-items:center;gap:8px;margin:8px 0 10px}
.calhead h2{flex:1;margin:0}
.calhead h2.mese{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:4px 0}
.day{background:var(--card);border-radius:12px;min-height:62px;padding:5px;cursor:pointer;border:2px solid transparent;overflow:hidden}
.day.fuori{opacity:.4}
.day.sel{border-color:var(--primary)}
.day .n{font-weight:800;font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.oggi .n{background:var(--primary);color:#fff}
.day .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.day .dot{width:7px;height:7px;border-radius:50%}
.day .pill{display:none;font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.day .more{display:none;font-size:11px;color:var(--muted);font-weight:700}
@media (min-width:700px){
  .day{min-height:96px}
  .day .dots{display:none}
  .day .pill,.day .more{display:block}
}
.modo{display:inline-flex;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--shadow);margin:4px 0 10px}
.modo button{border:0;background:transparent;border-radius:12px;padding:8px 16px;font-weight:800;cursor:pointer;color:var(--muted)}
.modo button.on{background:var(--primary);color:#fff}
.filtri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
@media (max-width:600px){.filtri{grid-template-columns:1fr 1fr}.filtri select:first-child{grid-column:1/-1}}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:10px}
.legenda b{color:var(--accent)}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.legenda i{width:11px;height:11px;border-radius:50%;display:inline-block}
.b-yellow{background:#fef3c7;color:#a16207}
@media (prefers-color-scheme: dark){.b-yellow{background:#423814;color:#facc15}}
.tabella{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow-x:auto}
.tabella table{width:100%;border-collapse:collapse;font-size:15px}
.tabella th{background:var(--primary);color:#fff;text-align:left;padding:12px 10px;font-weight:800;font-size:14px}
.tabella td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabella tbody tr{cursor:pointer}
.tabella tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.tabella tbody tr:hover{background:var(--primary-soft)}
.tabella td.data{font-weight:800;color:var(--primary);white-space:nowrap}
.tabella td.data .anno{display:block;font-size:12px;color:var(--muted);font-weight:700}
.tabella td.cosa{font-weight:700}
.tabella td.note{color:var(--muted)}
@media (max-width:700px){
  .tabella{background:transparent;box-shadow:none;border-radius:0}
  .tabella thead{display:none}
  .tabella table,.tabella tbody{display:block}
  .tabella tbody tr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;background:var(--card)!important;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
  .tabella td{border:0;padding:0}
  .tabella td.data{grid-row:1/span 2;text-align:center;align-self:center;font-size:14px}
  .tabella td.cosa{grid-column:2}
  .tabella td.giorni{grid-column:3;grid-row:1}
  .tabella td[data-l]{grid-column:2/-1;font-size:14px;color:var(--muted)}
  .tabella td[data-l]::before{content:attr(data-l) ": ";font-weight:700}
  .tabella td[data-l="Categoria"]{grid-column:2;grid-row:2}
  .tabella td.vuoto{display:none}
}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* Finestre */
.velo{position:fixed;inset:0;background:rgba(20,15,25,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:700px){.velo{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:0 0 14px;font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 5px;color:var(--muted)}
.in{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--card)}
.in:focus{outline:0;border-color:var(--primary)}
textarea.in{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{min-width:0}
input[type=date].in,input[type=time].in{min-width:0;-webkit-appearance:none;appearance:none;min-height:48px}
.azioni{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.azioni .btn{flex:1}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:7px 11px;cursor:pointer;font-weight:700}
.pick button.on{border-color:var(--primary);background:var(--primary-soft)}
.col{width:34px;height:34px;border-radius:50%;border:3px solid transparent!important;padding:0!important}
.col.on{border-color:var(--ink)!important}
.files{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.file{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 10px}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:16px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:none;text-align:center}
#caricamento{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:18px}
#caricamento .casa{font-size:58px;animation:salta 1s ease-in-out infinite}
#caricamento{padding:16px;text-align:center;overflow:auto}
#caricamento .aiuto{font-weight:600;font-size:15px;text-align:left;max-width:560px;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);line-height:1.45}
#caricamento .aiuto ol{padding-left:20px;margin:8px 0 0}
#caricamento .aiuto li{margin-bottom:6px}
@keyframes salta{50%{transform:translateY(-10px)}}
.mini{font-size:13px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:16px 0}
</style>
</head>

<script>
// Registro dei passi: se l'app si blocca, lo mostra sullo schermo (serve a capire cosa e' successo).
var REGISTRO = [];
function registra(m) { try { REGISTRO.push(new Date().toTimeString().slice(0, 8) + ' ' + m); } catch (e) {} }
function testoRegistro() { return REGISTRO.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function mostraRegistro(titolo) {
  var c = document.getElementById('caricamento');
  if (!c || c.style.display === 'none') return;
  c.innerHTML = '<div class="casa">😵</div>' + titolo +
    '<div class="mini" style="white-space:pre-wrap;text-align:left;max-width:560px">' + testoRegistro() + '</div>' +
    '<button class="btn" onclick="location.reload()">Riprova</button>';
}
window.addEventListener('error', function (e) { registra('ERRORE: ' + e.message + ' (riga ' + e.lineno + ')'); mostraRegistro('Qualcosa si è rotto nell\'app.'); });
window.addEventListener('unhandledrejection', function (e) { registra('ERRORE: ' + ((e.reason && e.reason.message) || e.reason)); });
registra('pagina caricata');
</script>

<script>

   Collegamento con Google (o modalita' prova nel browser)

function api(nome, ...args) {
  return new Promise((ok, ko) => {
    if (DEMO) {
      setTimeout(() => {
        try { ok(JSON.parse(JSON.stringify(PROVA[nome](...args)))); } catch (e) { ko(e); }

/* =========================================================

const S = {
  persone: [], documenti: [], impegni: [], spesa: [], progetti: [], numeri: [], ignorati: [], imp: {}, link: {},
  io: { email: '', nome: '', proprietario: true, emailAttiva: false },
  pagamenti: [], filtroPag: 'da', catPag: '',
  vista: 'home', mese: null, giornoSel: null, google: {}, googleCarico: {},
  filtroPersona: '', cerca: '', scan: null, pcFiles: {},
  calModo: (() => { try { return localStorage.getItem('casaSantoroModo') || 'mese'; } catch (e) { return 'mese'; } })(),
  elenco: { periodo: '90', chi: '', tipo: '' }
};

/* =========================================================
   Utilita'
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const daIso = s => { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const oggi = () => iso(new Date());
const giorniA = s => Math.round((daIso(s) - daIso(oggi())) / 86400000);
function addGiorni(s, n) { const d = daIso(s); d.setDate(d.getDate() + n); return iso(d); }
function fData(s, conGiorno) {
  if (!s) return '';
  const d = daIso(s);
  return (conGiorno ? GIORNI[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MESI[d.getMonth()].slice(0, 3) + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function quando(s) {
  const g = giorniA(s);
  if (g === 0) return 'oggi'; if (g === 1) return 'domani'; if (g === -1) return 'ieri';
  if (g > 1 && g < 7) return 'tra ' + g + ' giorni';
  return fData(s, true);
}
const persona = id => S.persone.find(p => p.id === id);
const tipoInfo = t => TIPI_DOC.find(x => x[0] === t) || [t, '📄', 30];
const catInfo = c => CATEGORIE.find(x => x[0] === c) || CATEGORIE[CATEGORIE.length - 1];
const filesDi = d => { try { return JSON.parse(d.files || '[]'); } catch (e) { return []; } };
const preavvisoDi = d => d.preavviso === '' || d.preavviso == null ? +S.imp.preavviso || 30 : +d.preavviso;

function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 2800);
}
function errore(e) { console.error(e); toast('Ops! 😅 ' + (e && e.message ? e.message : e), 5000); }

function statoScadenza(d) {
  if (!d.scadenza) return { cls: 'b-grey', txt: 'Non scade', liv: 0 };
  const g = giorniA(d.scadenza);
  if (g < 0) return { cls: 'b-red', txt: 'Scaduto ' + (g === -1 ? 'ieri' : 'da ' + (-g) + ' gg'), liv: 3 };
  if (g === 0) return { cls: 'b-red', txt: 'Scade oggi!', liv: 3 };
  if (g <= Math.max(preavvisoDi(d), 7)) return { cls: 'b-orange', txt: g === 1 ? 'Scade domani' : 'Tra ' + g + ' giorni', liv: 2 };
  return { cls: 'b-green', txt: 'Ok fino al ' + fData(d.scadenza), liv: 1 };
}

/* =========================================================
   Avvio
   ========================================================= */
function carica() {
  return api('getTutto').then(r => {
    S.persone = r.persone; S.documenti = r.documenti; S.impegni = r.impegni; S.ignorati = r.ignorati || [];
    S.spesa = r.spesa || []; S.pagamenti = r.pagamenti || [];
    S.imp = r.impostazioni; S.link = r.link || {}; S.io = r.io || S.io;
    $('#caricamento').style.display = 'none';
    render();
  });
}
function ricarica() { S.google = {}; S.googleCarico = {}; toast('Aggiorno… 🔄', 1200); carica().catch(errore); }

function vai(v) {
  chiudiFinestra();
  S.vista = v; window.scrollTo(0, 0); render();

}

const SCHEDA_DI = { cerca: 'doc', importa: 'doc', fam: '' };
function render() {
  const scheda = SCHEDA_DI[S.vista] || S.vista;

  const m = $('#main');
  let h = DEMO ? '<div class="demo">🧪 <b>Modalità prova</b>: i dati restano solo in questo browser. Quando l\'app sarà su Google, tutto andrà nel tuo Drive e nel calendario.</div>' : '';
  if (S.vista === 'home') h += vistaHome();
  if (S.vista === 'cal') h += vistaCalendario();
  if (S.vista === 'doc') h += vistaDocumenti();
  if (S.vista === 'fam') h += vistaFamiglia();
  if (S.vista === 'cerca') h += vistaCerca();
  if (S.vista === 'spesa') h += vistaSpesa();
  if (S.vista === 'pag') h += vistaPagamenti();
  if (S.vista === 'importa') h += vistaImporta();
  m.innerHTML = h;
  if (S.vista === "cal" && S.calModo !== "elenco") caricaGoogleMese();
}

/* =========================================================
   Cose del giorno (impegni, scadenze, compleanni, Google)
   ========================================================= */
function siRipete(o, s) {
  if (!o.data || s < o.data) return false;
  if (o.ripetiFino && s > o.ripetiFino) return false;
  const r = o.ripeti || 'no';
  if (r === 'no') return s === o.data;
  if (r === 'settimanale') return Math.round((daIso(s) - daIso(o.data)) / 86400000) % 7 === 0;
  if (r === 'mensile') return s.slice(8) === o.data.slice(8);
  if (r === 'annuale') return s.slice(5) === o.data.slice(5);
  return false;
}

function coseDelGiorno(s, conGoogle) {
  const out = [];
  S.impegni.forEach(o => {
    if (!siRipete(o, s)) return;
    const c = catInfo(o.categoria);
    const ids = String(o.persone || '').split(',').filter(Boolean);
    const p = ids.map(persona).filter(Boolean);
    out.push({
      tipo: 'imp', id: o.id, ico: c[1], colore: p.length === 1 ? p[0].colore : c[2],
      titolo: o.titolo, ora: o.tuttoIlGiorno === 'si' ? '' : (o.oraInizio || ''),
      sotto: [o.tuttoIlGiorno === 'si' || !o.oraInizio ? 'Tutto il giorno' : o.oraInizio + (o.oraFine ? '–' + o.oraFine : ''), p.map(x => x.nome).join(', '), o.luogo].filter(Boolean).join(' · ')
    });
  });
  S.documenti.forEach(d => {
    if (!d.scadenza) return;
    const p = persona(d.personaId);
    const nome = d.tipo + (p ? ' di ' + p.nome : '');
    if (d.scadenza === s) out.push({ tipo: 'doc', id: d.id, ico: '⚠️', colore: '#e8453c', titolo: 'Scade: ' + nome, ora: '', sotto: 'Documento in scadenza' });
    const pre = preavvisoDi(d);
    if (pre > 0 && addGiorni(d.scadenza, -pre) === s) out.push({ tipo: 'doc', id: d.id, ico: '⏰', colore: '#f59e0b', titolo: 'Da rinnovare: ' + nome, ora: '', sotto: 'Scade il ' + fData(d.scadenza) });
  });
  S.pagamenti.forEach(p => {
    if (p.pagata === 'si' || p.scadenza !== s) return;
    const c = catPag(p.categoria);
    out.push({ tipo: 'pag', id: p.id, ico: c[1], colore: giorniA(s) < 0 ? '#e8453c' : '#d4a017', titolo: 'Da pagare: ' + p.titolo + (numero(p.importo) ? ' – ' + euro(p.importo) : ''), ora: '', sotto: [p.periodo, p.metodo].filter(Boolean).join(' · ') || 'Bolletta / pagamento' });
  });
  S.persone.forEach(p => {
    if (p.nascita && p.nascita.slice(5) === s.slice(5) && s >= p.nascita) {
      const anni = +s.slice(0, 4) - +p.nascita.slice(0, 4);
      out.push({ tipo: 'per', id: p.id, ico: '🎂', colore: p.colore || '#ff9f1c', titolo: 'Compleanno di ' + p.nome, ora: '', sotto: anni ? 'Fa ' + anni + ' anni 🎉' : 'È nato/a oggi!' });
    }
  });
  if (conGoogle && S.imp.mostraGoogle) {
    (S.google[chiaveMese()] || []).forEach(e => {
      if (e.data <= s && s <= (e.fine || e.data)) out.push({ tipo: 'g', ico: '🗓️', colore: e.colore || '#9aa0a6', titolo: e.titolo, ora: e.ora, sotto: [e.ora ? e.ora + (e.oraFine ? '–' + e.oraFine : '') : 'Tutto il giorno', e.calendario, e.luogo].filter(Boolean).join(' · '), google: true });
    });
  }
  out.sort((a, b) => (a.ora || '') < (b.ora || '') ? -1 : (a.ora || '') > (b.ora || '') ? 1 : 0);
  return out;
}

function rigaCosa(c, data) {
  const click = c.tipo === 'imp' ? `apriImpegno('${c.id}')` : c.tipo === 'doc' ? `apriDocumento('${c.id}')` : c.tipo === 'per' ? `apriPersona('${c.id}')` : c.tipo === 'pag' ? `apriPagamento('${c.id}')` : '';
  return `<div class="row" ${click ? `onclick="${click}"` : 'style="cursor:default"'}>
    <div class="ico" style="background:${c.colore}22">${c.ico}</div>
    <div class="txt"><div class="t">${esc(c.titolo)}</div><div class="s">${data ? esc(quando(data)) + ' · ' : ''}${esc(c.sotto)}</div></div>
    ${c.google ? '<span class="badge b-grey">Google</span>' : ''}
  </div>`;
}

/* =========================================================
   Home
   ========================================================= */
function vistaHome() {
  const ora = new Date().getHours();
  const saluto = ora < 6 ? 'Notte fonda' : ora < 13 ? 'Buongiorno' : ora < 18 ? 'Buon pomeriggio' : 'Buonasera';
  const nome = S.io.nome;
  let h = `<div class="hello">${saluto}${nome ? ', ' + esc(nome) : ''}! 👋</div><p class="sub">Oggi è ${fData(oggi(), true)}. Vediamo un po' che c'è in giro.</p>`;

  if (!S.persone.length) {
    return h + `<div class="card"><div class="empty"><b>👨‍👩‍👦</b>Per cominciare aggiungi te stesso e la tua famiglia.<br>Poi ci mettiamo i documenti!</div>
      <div class="azioni"><button class="btn" onclick="apriPersona()">➕ Aggiungi una persona</button></div></div>`;
  }

  const scaduti = S.documenti.filter(d => d.scadenza && giorniA(d.scadenza) < 0).sort((a, b) => a.scadenza < b.scadenza ? -1 : 1);
  const presto = S.documenti.filter(d => d.scadenza && giorniA(d.scadenza) >= 0 && giorniA(d.scadenza) <= Math.max(preavvisoDi(d), 7)).sort((a, b) => a.scadenza < b.scadenza ? -1 : 1);

  const daPrendere = S.spesa.filter(x => x.preso !== 'si').length;
  const scadNum = scaduti.length + presto.length;
  const daPagare = S.pagamenti.filter(p => p.pagata !== 'si' && p.scadenza && giorniA(p.scadenza) <= 30).sort((a, b) => a.scadenza < b.scadenza ? -1 : 1);
  const totDaPagare = daPagare.reduce((s, p) => s + numero(p.importo), 0);
  h += `<div class="tiles">
    <button onclick="vai('doc')"><b>📂</b>Documenti<small>${scadNum ? scadNum + ' da guardare' : S.documenti.length + ' in archivio'}</small></button>
    <button onclick="vai('cal')"><b>📅</b>Calendario<small>${S.impegni.length} impegni</small></button>
    <button onclick="vai('pag')"><b>💶</b>Bollette<small>${daPagare.length ? daPagare.length + ' da pagare' : 'Tutto pagato'}</small></button>
    <button onclick="vai('spesa')"><b>🛒</b>Spesa<small>${daPrendere ? daPrendere + ' da prendere' : 'Lista vuota'}</small></button>
    <button onclick="vai('fam')"><b>👨‍👩‍👦</b>Famiglia<small>${S.persone.length} persone</small></button>
    <button onclick="vai('importa')"><b>📥</b>Importa<small>Da una cartella</small></button>
  </div>`;

  h += '<div class="grid2">';
  if (scaduti.length) {
    h += `<div class="card"><h2 style="margin-top:0">🚨 Occhio, sono scaduti!</h2>${scaduti.map(rigaDoc).join('')}</div>`;
  }
  if (daPagare.length) {
    h += `<div class="card"><h2 style="margin-top:0">💶 Da pagare <span class="mini">${euro(totDaPagare)}</span></h2>${daPagare.map(rigaPagamento).join('')}</div>`;
  }
  h += `<div class="card"><h2 style="margin-top:0">⏳ Stanno per scadere</h2>${presto.length ? presto.map(rigaDoc).join('') : '<div class="empty"><b>😎</b>Tutto tranquillo, nessuna scadenza vicina.</div>'}</div>`;

  const prossimi = [];
  for (let i = 0; i < 14 && prossimi.length < 12; i++) {
    const s = addGiorni(oggi(), i);
    coseDelGiorno(s, false).filter(c => c.tipo !== 'doc').forEach(c => prossimi.push([s, c]));
  }
  h += `<div class="card"><h2 style="margin-top:0">📌 Nei prossimi giorni</h2>${prossimi.length ? prossimi.map(x => rigaCosa(x[1], x[0])).join('') : '<div class="empty"><b>🛋️</b>Niente in programma per due settimane. Goditela!</div>'}</div>`;
  h += '</div>';
  return h;
}

function rigaDoc(d) {
  const p = persona(d.personaId), st = statoScadenza(d), t = tipoInfo(d.tipo), nf = filesDi(d).length;
  return `<div class="row" onclick="apriDocumento('${d.id}')">
    <div class="ico" style="background:${(p && p.colore) || '#ff6b57'}22">${t[1]}</div>
    <div class="txt"><div class="t">${esc(d.tipo)}</div><div class="s">${p ? esc(p.emoji || '') + ' ' + esc(p.nome) : 'Nessuno'}${nf ? ' · 📎 ' + nf : ''}${d.numero ? ' · n. ' + esc(d.numero) : ''}</div></div>
    <span class="badge ${st.cls}">${st.txt}</span>
  </div>`;
}

/* =========================================================
   Calendario interno
   ========================================================= */
function chiaveMese() { return iso(S.mese); }
function celleMese() {
  const primo = new Date(S.mese);
  const start = new Date(primo); start.setDate(1 - ((primo.getDay() + 6) % 7));
  const celle = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); celle.push(d); }
  if (celle[35].getMonth() !== primo.getMonth()) celle.length = 35;
  return celle;
}
function interruttoreModo() {
  return `<div class="modo">
    <button class="${S.calModo !== 'elenco' ? 'on' : ''}" onclick="cambiaModo('mese')">🗓️ Mese</button>
    <button class="${S.calModo === 'elenco' ? 'on' : ''}" onclick="cambiaModo('elenco')">📋 Elenco</button>
  </div>`;
}
function cambiaModo(m) {
  S.calModo = m;
  try { localStorage.setItem('casaSantoroModo', m); } catch (e) {}
  render();
}

/* ---------- Calendario come elenco (stile gestionale) ---------- */
function badgeGiorni(data) {
  const g = giorniA(data);
  if (g < 0) return `<span class="badge b-red">Scaduto da ${-g} gg</span>`;
  if (g === 0) return '<span class="badge b-red">Oggi!</span>';
  if (g <= 15) return `<span class="badge b-orange">${g === 1 ? 'Domani' : 'Tra ' + g + ' gg'}</span>`;
  if (g <= 30) return `<span class="badge b-yellow">Tra ${g} gg</span>`;
  return `<span class="badge b-green">Tra ${g} gg</span>`;
}
const RIPETE = { settimanale: 'ogni settimana', mensile: 'ogni mese', annuale: 'ogni anno' };
function prossimaVolta(o, da, a) {
  for (let s = da; s <= a; s = addGiorni(s, 1)) if (siRipete(o, s)) return s;
  return null;
}
function righeElenco() {
  const E = S.elenco, oggiS = oggi();
  const fine = E.periodo === 'tutto' ? addGiorni(oggiS, 730) : addGiorni(oggiS, +E.periodo);
  const righe = [];
  if (!E.tipo || E.tipo === 'doc') {
    S.documenti.forEach(d => {
      if (!d.scadenza || d.scadenza > fine) return;
      if (E.chi && d.personaId !== E.chi) return;
      const p = persona(d.personaId);
      righe.push({ data: d.scadenza, cat: '📄 Documento', cosa: tipoInfo(d.tipo)[1] + ' ' + d.tipo, chi: p ? p.nome : '-', rif: d.numero || '-', note: d.note || '-', click: `apriDocumento('${d.id}')` });
    });
  }
  if (!E.tipo || E.tipo === 'imp') {
    S.impegni.forEach(o => {
      const ids = String(o.persone || '').split(',').filter(Boolean);
      if (E.chi && !ids.includes(E.chi)) return;
      const ripete = o.ripeti && o.ripeti !== 'no';
      // impegni singoli: anche quelli gia' passati nell'ultimo mese; ripetuti: solo la prossima volta
      const s = ripete ? prossimaVolta(o, oggiS, fine) : (o.data <= fine && o.data >= addGiorni(oggiS, -30) ? o.data : null);
      if (!s) return;
      const c = catInfo(o.categoria);
      righe.push({
        data: s, cat: c[1] + ' ' + c[0], cosa: o.titolo + (ripete ? ' 🔁 ' + RIPETE[o.ripeti] : ''),
        chi: ids.map(persona).filter(Boolean).map(x => x.nome).join(', ') || '-',
        rif: [o.tuttoIlGiorno === 'si' || !o.oraInizio ? '' : o.oraInizio + (o.oraFine ? '–' + o.oraFine : ''), o.luogo].filter(Boolean).join(' · ') || '-',
        note: o.note || '-', click: `apriImpegno('${o.id}')`
      });
    });
  }
  if (!E.tipo || E.tipo === 'pag') {
    S.pagamenti.forEach(p => {
      if (p.pagata === 'si' || !p.scadenza || p.scadenza > fine) return;
      if (E.chi && p.personaId !== E.chi) return;
      const c = catPag(p.categoria), chi = persona(p.personaId);
      righe.push({ data: p.scadenza, cat: c[1] + ' ' + c[0], cosa: 'Da pagare: ' + p.titolo, chi: chi ? chi.nome : '-', rif: [euro(p.importo), p.metodo].filter(Boolean).join(' · ') || '-', note: p.periodo || p.note || '-', click: `apriPagamento('${p.id}')` });
    });
  }
  if (!E.tipo || E.tipo === 'comp') {
    S.persone.forEach(p => {
      if (!p.nascita || (E.chi && p.id !== E.chi)) return;
      let s = oggiS.slice(0, 4) + p.nascita.slice(4);
      if (s < oggiS) s = (+oggiS.slice(0, 4) + 1) + p.nascita.slice(4);
      if (s > fine) return;
      righe.push({ data: s, cat: '🎂 Compleanno', cosa: 'Compleanno di ' + p.nome, chi: p.nome, rif: 'Fa ' + (+s.slice(0, 4) - +p.nascita.slice(0, 4)) + ' anni', note: '-', click: `apriPersona('${p.id}')` });
    });
  }
  righe.sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  return righe;
}
function vistaElenco() {
  const E = S.elenco;

  let h = interruttoreModo() + `

  if (!righe.length) return h + `<div class="card"><div class="empty"><b>🌴</b>Niente in questo periodo. Che pace!</div></div>`;

      <td data-l="Categoria">${esc(r.cat)}</td>

function personaScelta(boxId) { const b = document.querySelector('#' + boxId + ' button.on'); return b ? b.dataset.id : ''; }

async function caricaFiles(lista) {
  const p = persona(personaScelta('fPersona'));
  const tipo = ($('#fTipo') && $('#fTipo').value.trim()) || 'Documento';
  const cartella = F.cartella || (p ? p.nome : 'Senza nome');
  for (const file of lista) {
    try {
      if (file.size > 30 * 1024 * 1024) { toast('“' + file.name + '” è troppo grande (max 30 MB)'); continue; }
      toast('Carico “' + file.name + '”… ⏳', 60000);
      const pronto = await preparaFile(file);
      const nome = tipo + (p ? ' - ' + p.nome : '') + ' - ' + pronto.nome;
      const r = await api('caricaFile', cartella, nome, pronto.mime, pronto.base64);
      F.files.push(r); F.nuovi.push(r.id);
      disegnaFiles(); toast('File caricato 👍');
    } catch (e) { errore(e); }
  }
}
// Le foto grandi le rimpicciolisco un po' (si caricano prima). I PDF restano come sono.
function preparaFile(file) {
  return new Promise((ok, ko) => {
    const rd = new FileReader();
    rd.onerror = () => ko(new Error('Non riesco a leggere il file'));
    if (/^image\/(jpeg|png|webp|heic)/.test(file.type)) {
      rd.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 2200, k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          const url = c.toDataURL('image/jpeg', 0.85);
          ok({ nome: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', base64: url.split(',')[1] });
        };
        img.onerror = () => ok({ nome: file.name, mime: file.type, base64: rd.result.split(',')[1] });
        img.src = rd.result;
      };
    } else {
      rd.onload = () => ok({ nome: file.name, mime: file.type || 'application/octet-stream', base64: rd.result.split(',')[1] });
    }
    rd.readAsDataURL(file);
  });
}

   Cerca documenti in una cartella (SOLO LETTURA)
   ========================================================= */
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const haParola = (testo, w) => w && (' ' + testo + ' ').includes(' ' + w + ' ');

const INDIZI_TIPO = [
  [/carta (d )?identita|\bcie\b|carta identita elettronica/, "Carta d'identità"],
  [/passaport/, 'Passaporto'], [/patente/, 'Patente'],
  [/tessera sanitaria|\btessera ts\b/, 'Tessera sanitaria'], [/codice fiscale/, 'Codice fiscale'],
  [/libretto pediatrico|vaccin/, 'Vaccini'],
  [/assicuraz|polizza|unipol|allianz|generali/, 'Assicurazione auto'],
  [/\bbollo\b|bolli/, 'Bollo auto'], [/revisione/, 'Revisione auto'],
  [/libretto/, 'Libretto di circolazione'],
  [/piano terapeutico/, 'Piano terapeutico'],
  [/esami|analisi|referto|cartella clinica|ecografia|radiograf/, 'Esami / referti'],
  [/ricetta/, 'Ricetta medica'], [/invalidita|disabilita|\b104\b/, 'Invalidità / 104'],
  [/\bisee\b|\bdsu\b/, 'ISEE'], [/busta paga|buste paga|cedolino|\bcud\b|\bcu\b/, 'Busta paga / CU'],
  [/\b730\b|redditi|unico/, 'Dichiarazione dei redditi'], [/contratto/, 'Contratto'],
  [/bollett|enel|iren|acqua|\bgas\b|\bluce\b/, 'Bolletta'], [/diploma|laurea|attestato|certificat/, 'Titolo di studio'],
  [/abbonament/, 'Abbonamento']
];
function indovinaTipo(testo) { const t = INDIZI_TIPO.find(x => x[0].test(testo)); return t ? t[1] : 'Altro'; }

function paroleChiave(p) {
  const forti = [], medie = [], deboli = [];
  const n = norm(p.nome), c = norm(p.cognome);
  if (n && c) { forti.push(n + ' ' + c, c + ' ' + n); }
  String(p.altriNomi || '').split(',').map(norm).filter(Boolean).forEach(a => (a.includes(' ') ? forti : medie).push(a));
  if (c && c.length >= 4) medie.push(c);
  if (n && n.length >= 3) medie.push(n);
  const rel = norm(p.relazione);
  if (rel && rel !== 'io' && rel !== 'altro') deboli.push(rel);
  return { forti, medie, deboli, cf: norm(p.codiceFiscale).replace(/ /g, '') };
}
function analizza(files) {
  const chiavi = S.persone.map(p => [p, paroleChiave(p)]);
  const giaIn = new Set();
  S.documenti.forEach(d => filesDi(d).forEach(f => f.origine && giaIn.add(f.origine)));
  const out = [];
  files.forEach(f => {
    if (/^(video|audio)$/.test(String(f.mime || '').split('/')[0]) || /\.(mkv|mp4|avi|mov|mp3|wav|mpeg|lnk|ini|db|exe|zip|rar)$/i.test(f.nome)) return;
    const testo = norm((f.percorso || '') + ' ' + f.nome.replace(/\.\w+$/, ''));
    const compatto = testo.replace(/ /g, '');
    let best = [], punti = 0;
    chiavi.forEach(([p, k]) => {
      let v = 0;
      if (k.cf && k.cf.length >= 11 && compatto.includes(k.cf)) v = 3;
      else if (k.forti.some(w => testo.includes(w))) v = 3;
      else if (k.medie.some(w => haParola(testo, w))) v = 2;
      else if (k.deboli.some(w => haParola(testo, w))) v = 1;
      if (v > punti) { punti = v; best = [p]; } else if (v && v === punti) best.push(p);
    });
    if (!punti) return;
    out.push(Object.assign({}, f, { persone: best.map(p => p.id), punti, tipo: indovinaTipo(testo), gia: giaIn.has(f.origine) }));
  });
  out.sort((a, b) => b.punti - a.punti || (a.percorso + a.nome).localeCompare(b.percorso + b.nome));
  return out;
}

function importaDaPC() {
  const inp = $('#inCartella'); inp.value = '';
  inp.onchange = async () => {
    const files = Array.from(inp.files);
    if (!files.length) return;
    // percorsi relativi alla cartella scelta (senza il nome della cartella)
    const mappa = {};
    let jsonFile = null, jsonProf = 99;
    files.forEach(f => {
      const parti = (f.webkitRelativePath || f.name).split('/');
      const rel = parti.slice(1).join('/') || f.name;
      mappa[rel.toLowerCase()] = f;
      if (f.name.toLowerCase() === NOME_IMPORT && parti.length < jsonProf) { jsonFile = f; jsonProf = parti.length; }
    });
    if (!jsonFile) return toast('In questa cartella non c\'è il file ' + NOME_IMPORT + '. Fallo preparare prima alla chat di Claude 🙂', 6000);
    try {
      const testo = await jsonFile.text();
      preparaImport(testo, { fonte: 'pc', nome: (files[0].webkitRelativePath || '').split('/')[0], file: rel => mappa[String(rel || '').toLowerCase()] });
    } catch (e) { errore(e); }
  };
  inp.click();
}

function importaDaDrive() {
  const link = $('#impLink').value.trim();
  if (!link) return toast('Incolla prima il link della cartella 🙂');
  const btn = $('#impVai'); btn.disabled = true; btn.textContent = '⏳';
  api('leggiImportazioneDrive', link).then(r => {
    const mappa = {};
    r.files.forEach(f => { mappa[(f.percorso ? f.percorso.split(' / ').join('/') + '/' : '') .toLowerCase() + f.nome.toLowerCase()] = f; });
    preparaImport(r.testo, { fonte: 'drive', nome: r.nomeCartella, file: rel => mappa[String(rel || '').toLowerCase()] });
  }).catch(e => { btn.disabled = false; btn.textContent = 'Leggi'; errore(e); });
}

// Cerca una persona dell'app: codice fiscale, poi nome e cognome, poi soprannomi, poi solo il nome (se non ci sono omonimi)
function trovaPersonaImport(p, extra) {
  if (!p) return null;
  const tutte = S.persone.concat(extra || []);
  const cf = String(p.codiceFiscale || '').toUpperCase().replace(/\s/g, '');
  if (cf) { const x = tutte.find(q => String(q.codiceFiscale || '').toUpperCase() === cf); if (x) return x; }
  const n = norm(p.nome), c = norm(p.cognome);
  if (n && c) {
    const x = tutte.find(q => (norm(q.nome) === n && norm(q.cognome) === c) || (norm(q.nome) === c && norm(q.cognome) === n));
    if (x) return x;
  }
  const nomi = [n].concat(String(p.altriNomi || '').split(',').map(norm)).filter(Boolean);
  const perSoprannome = tutte.filter(q => {
    const suoi = [norm(q.nome)].concat(String(q.altriNomi || '').split(',').map(norm)).filter(Boolean);
    return nomi.some(x => suoi.includes(x)) && (!c || !q.cognome || norm(q.cognome) === c);
  });
  return perSoprannome.length === 1 ? perSoprannome[0] : null;
}

function preparaImport(testo, fonte) {
  let j;
  try { j = JSON.parse(String(testo).replace(/^\uFEFF/, '')); } catch (e) { return toast('Il file ' + NOME_IMPORT + ' è rovinato: fallo rifare alla chat 😅', 6000); }
  if (!j || j.formato !== 'casa-santoro-importazione') return toast('Questo file non è per Casa Santoro/Longobardi 🤔', 5000);
  const voci = [];
  const nuove = []; // persone che verranno create (finte, per gli abbinamenti)
  const chiave = p => p ? (String(p.codiceFiscale || '').toUpperCase() || norm((p.nome || '') + ' ' + (p.cognome || ''))) : '';

  // 1. Persone
  const elencoPersone = (j.persone || []).slice();
  (j.documenti || []).forEach(d => { if (d.persona && (d.persona.nome || d.persona.cognome) && !elencoPersone.some(p => chiave(p) === chiave(d.persona))) elencoPersone.push(d.persona); });
  elencoPersone.forEach(p => {
    if (!p.nome && !p.cognome) return;
    const gia = trovaPersonaImport(p, nuove);
    if (gia) {
      if (!gia._nuova) voci.push({ tipo: 'persona', dati: p, stato: 'gia', sel: false, msg: 'C\'è già: ' + gia.nome, persona: gia });
      return;
    }
    const finta = Object.assign({ _nuova: true, id: 'nuova' + nuove.length }, p);
    nuove.push(finta);
    voci.push({ tipo: 'persona', dati: p, stato: 'nuovo', sel: true, msg: 'Nuova persona', persona: finta });
  });
  const personaDi = p => trovaPersonaImport(p, nuove);

  // 2. Documenti
  (j.documenti || []).forEach(d => {
    const v = { tipo: 'doc', dati: d, sel: true, stato: 'nuovo', msg: '', file: d.file ? fonte.file(d.file) : null };
    v.persona = personaDi(d.persona);
    if (!v.persona) { v.stato = 'problema'; v.sel = false; v.msg = 'Non so di chi è: aggiungilo a mano'; voci.push(v); return; }
    if (!d.tipo) { v.stato = 'problema'; v.sel = false; v.msg = 'Tipo di documento mancante'; voci.push(v); return; }
    if (d.file && !v.file) v.msg = '⚠️ File “' + d.file + '” non trovato nella cartella: importo solo i dati';
    const origine = (fonte.fonte === 'drive' && v.file ? 'drive:' + v.file.id : 'pc:' + d.file);
    const t = norm(d.tipo);
    const stessi = v.persona._nuova ? [] : S.documenti.filter(x => x.personaId === v.persona.id && norm(x.tipo) === t);
    const giaFile = S.documenti.find(x => filesDi(x).some(f => f.origine === origine));
    let simile = null;
    if (giaFile) simile = giaFile;
    else if (TIPI_UNICI.includes(t)) simile = stessi.find(x => TIPI_PERSONALI.includes(t) || !d.numero || !x.numero || norm(x.numero) === norm(d.numero));
    else simile = stessi.find(x => (d.numero && norm(x.numero) === norm(d.numero)) || (d.scadenza && x.scadenza === d.scadenza && x.rilascio === (d.rilascio || '')));
    if (simile) {
      v.esistente = simile;
      if (giaFile || !d.scadenza || (simile.scadenza && d.scadenza <= simile.scadenza)) {
        v.stato = 'gia'; v.sel = false;
        v.msg = giaFile ? 'Già importato' : (simile.scadenza && d.scadenza && d.scadenza < simile.scadenza ? 'Nell\'app c\'è già uno più recente' : 'C\'è già nell\'app');
      } else {
        v.stato = 'aggiorna';
        v.msg = 'Aggiorno quello che c\'è' + (simile.scadenza ? ' (scadeva il ' + fData(simile.scadenza) + ')' : '');
      }
    }
    v.origine = origine;
    voci.push(v);
  });

  // 3. Impegni
  (j.impegni || []).forEach(o => {
    const v = { tipo: 'imp', dati: o, sel: true, stato: 'nuovo', msg: '' };
    if (!o.titolo || !o.data) { v.stato = 'problema'; v.sel = false; v.msg = 'Manca il titolo o la data'; }
    else if (o.data < oggi()) { v.stato = 'gia'; v.sel = false; v.msg = 'È già passato'; }
    else if (S.impegni.some(x => norm(x.titolo) === norm(o.titolo) && x.data === o.data)) { v.stato = 'gia'; v.sel = false; v.msg = 'C\'è già nel calendario'; }
    v.persone = (o.persone || []).map(n => personaDi(typeof n === 'string' ? { nome: n } : n)).filter(Boolean);
    voci.push(v);
  });

  // 4. Numeri utili
  (j.numeri || []).forEach(n => {
    const v = { tipo: 'num', dati: n, sel: true, stato: 'nuovo', msg: '' };
    const tel = telPulito(n.telefono || n.telefono2);
    if (!n.nome || (!tel && !n.email)) { v.stato = 'problema'; v.sel = false; v.msg = 'Manca il nome o il numero'; }
    else if (S.numeri.some(x => (tel && (telPulito(x.telefono) === tel || telPulito(x.telefono2) === tel)) || norm(x.nome) === norm(n.nome))) { v.stato = 'gia'; v.sel = false; v.msg = 'C\'è già in rubrica'; }
    voci.push(v);
  });

  if (!voci.length) return toast('Il file è vuoto: la chat non ha trovato niente da importare 🤷', 5000);
  S_IMP.dati = { fonte, voci, creato: j.creato || '' };
  render();
}

async function eseguiImport() {
  const { fonte, voci } = S_IMP.dati;
  const btn = $('#impBtn'); if (btn) { btn.disabled = true; }
  const daFare = voci.filter(v => v.sel);
  let fatti = 0, errori = 0;
  const passo = () => { const b = $('#impBtn'); if (b) b.textContent = '⏳ ' + fatti + ' di ' + daFare.length + '…'; };
  passo();
  // Le persone nuove per prime: servono a documenti e impegni
  const idDi = {};
  for (const v of daFare.filter(v => v.tipo === 'persona')) {
    try {
      const d = v.dati, i = S.persone.length;
      const r = await api('salva', 'Persone', {
        nome: d.nome || d.cognome, cognome: d.cognome || '', relazione: d.relazione || '', nascita: d.nascita || '',
        codiceFiscale: String(d.codiceFiscale || '').toUpperCase(), altriNomi: d.altriNomi || '',
        colore: COLORI[i % COLORI.length], emoji: EMOJI[i % EMOJI.length], note: '', email: ''
      });
      S.persone.push(r.obj); idDi[v.persona.id] = r.obj; v.stato = 'fatto';
    } catch (e) { v.stato = 'errore'; v.msg = e.message || String(e); errori++; }
    v.sel = false; fatti++; passo();
  }
  const vera = p => !p ? null : p._nuova ? idDi[p.id] || null : p;
  for (const v of daFare.filter(v => v.tipo !== 'persona')) {
    try {
      const d = v.dati;
      if (v.tipo === 'doc') {
        const p = vera(v.persona);
        if (!p) throw new Error('la persona non è stata creata');
        const doc = v.esistente ? Object.assign({}, v.esistente) : { files: '[]', preavviso: '' };
        doc.personaId = p.id; doc.tipo = d.tipo;
        if (d.numero) doc.numero = d.numero;
        if (d.rilascio) doc.rilascio = d.rilascio;
        if (d.scadenza) doc.scadenza = d.scadenza;
        if (!doc.preavviso && doc.preavviso !== 0) { const t = TIPI_DOC.find(x => x[0] === d.tipo); doc.preavviso = String(t ? t[2] : (+S.imp.preavviso || 30)); }
        const note = [d.note, d.dubbi ? 'Da controllare: ' + d.dubbi : ''].filter(Boolean).join(' · ');
        if (note) doc.note = v.esistente && doc.note ? doc.note + ' · ' + note : note;
        const files = filesDi(doc);
        if (v.file) {
          let copia;
          if (fonte.fonte === 'drive') copia = await api('copiaFileDrive', v.file.id, p.nome);
          else { const pr = await preparaFile(v.file); copia = await api('caricaFile', p.nome, d.tipo + ' - ' + p.nome + ' - ' + pr.nome, pr.mime, pr.base64); }
          copia.origine = v.origine; files.push(copia);
        }
        doc.files = JSON.stringify(files);
        const r = await api('salva', 'Documenti', doc);
        const k = S.documenti.findIndex(x => x.id === r.obj.id);
        if (k >= 0) S.documenti[k] = r.obj; else S.documenti.push(r.obj);
        if (r.avviso) v.msg = r.avviso;
      }
      if (v.tipo === 'imp') {
        const o = {
          titolo: d.titolo, categoria: catInfo(d.categoria)[0], data: d.data, oraInizio: d.oraInizio || '', oraFine: d.oraFine || '',
          tuttoIlGiorno: d.oraInizio ? 'no' : 'si', persone: (v.persone || []).map(vera).filter(Boolean).map(p => p.id).join(','),
          luogo: d.luogo || '', note: [d.note, d.dubbi ? 'Da controllare: ' + d.dubbi : ''].filter(Boolean).join(' · '),
          ripeti: 'no', ripetiFino: '', promemoria: '1440'
        };
        const r = await api('salva', 'Impegni', o); S.impegni.push(r.obj);
      }
      if (v.tipo === 'num') {
        const r = await api('salva', 'Numeri', {
          nome: d.nome, categoria: catNum(d.categoria)[0], telefono: d.telefono || '', telefono2: d.telefono2 || '',
          email: d.email || '', indirizzo: d.indirizzo || '', note: d.note || '', preferito: ''
        });
        S.numeri.push(r.obj);
      }
      v.stato = 'fatto';
    } catch (e) { v.stato = 'errore'; v.msg = 'Non riuscito: ' + (e.message || e); errori++; }
    v.sel = false; fatti++; passo();
  }
  render();
  toast(errori ? 'Fatto, ma ' + errori + ' non sono riuscit' + (errori === 1 ? 'o' : 'i') + ': li vedi in rosso' : 'Importato tutto! 🎉 Scadenze messe nel calendario 📅', 6000);
}

const CAT_PAG = [
  ['Luce', '💡', '#f59e0b'], ['Gas', '🔥', '#ef6f8f'], ['Acqua', '💧', '#00a3d9'], ['Telefono e internet', '📶', '#6b8cff'],
  ['Rifiuti (TARI)', '🗑️', '#22b07d'], ['Tasse e IMU', '🏛️', '#5b6b7f'], ['Mutuo e prestiti', '🏦', '#a17cf0'],
  ['Affitto', '🔑', '#8d6e63'], ['Condominio', '🏢', '#7c9cbf'], ['Assicurazioni', '🛡️', '#12b5a5'], ['Auto e bollo', '🚗', '#5b6b7f'],
  ['Scuola e asilo', '🏫', '#ff9f1c'], ['Sport e corsi', '⚽', '#22b07d'], ['Abbonamenti', '🎫', '#ef6f8f'], ['Salute', '🩺', '#ef6f8f'],
  ['Altro', '💶', '#ff6b57']
];
const METODI = ['Domiciliazione', 'PagoPA', 'Bonifico', 'Carta', 'Bollettino', 'F24', 'Contanti', 'Altro'];
const RIPETI_PAG = [['no', 'Una volta sola'], ['1', 'Ogni mese'], ['2', 'Ogni 2 mesi'], ['3', 'Ogni 3 mesi'], ['4', 'Ogni 4 mesi'], ['6', 'Ogni 6 mesi'], ['12', 'Ogni anno']];
const SUGGERIMENTI_PAG = ['Luce', 'Gas', 'Acqua', 'Internet', 'Telefono', 'TARI', 'IMU', 'Mutuo', 'Condominio', 'Affitto', 'Bollo auto', 'Assicurazione auto', 'Canone RAI', 'Asilo nido', 'Mensa scolastica', 'Palestra', 'Prestito'];
const catPag = c => CAT_PAG.find(x => x[0] === c) || CAT_PAG[CAT_PAG.length - 1];
const numero = n => { const v = parseFloat(String(n == null ? '' : n).replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isNaN(v) ? 0 : v; };
const euro = n => numero(n).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
function addMesi(s, n) {
  const d = daIso(s), giorno = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(giorno, ultimo));
  return iso(d);
}
function barra(q, colore) {
  const pc = Math.max(0, Math.min(1, q || 0)) * 100;
  return `<div class="barra"><i style="width:${pc}%;background:${colore}"></i></div>`;
}
// Indovina la categoria dal nome (es. "Enel luce" -> Luce)
function indovinaCatPag(t) {
  const n = norm(t);
  const regole = [[/luce|enel|energia|elettric/, 'Luce'], [/\bgas\b|metano/, 'Gas'], [/acqua|idric|ausino|gori/, 'Acqua'],
    [/tim|vodafone|wind|iliad|fastweb|internet|telefon|fibra/, 'Telefono e internet'], [/tari|rifiuti/, 'Rifiuti (TARI)'],
    [/imu|tasi|f24|tass|agenzia entrate|irpef|canone rai/, 'Tasse e IMU'], [/mutuo|prestito|finanziament|findomestic|rata/, 'Mutuo e prestiti'],
    [/affitto|pigione/, 'Affitto'], [/condomin/, 'Condominio'], [/assicuraz|polizza|unipol|allianz|generali/, 'Assicurazioni'],
    [/bollo|auto|revisione|carburante/, 'Auto e bollo'], [/asilo|nido|scuola|mensa|retta|libri/, 'Scuola e asilo'],
    [/palestra|piscina|calcio|corso|danza|sport/, 'Sport e corsi'], [/netflix|spotify|abbonament|amazon|disney|sky|dazn/, 'Abbonamenti'],
    [/ticket|farmac|medic|visita|dentist/, 'Salute']];
  const r = regole.find(x => x[0].test(n));
  return r ? r[1] : 'Altro';
}

function statoPagamento(p) {
  if (p.pagata === 'si') return { cls: 'b-green', txt: 'Pagata' + (p.dataPagamento ? ' il ' + fData(p.dataPagamento) : '') };
  if (!p.scadenza) return { cls: 'b-grey', txt: 'Senza scadenza' };
  const g = giorniA(p.scadenza);
  if (g < 0) return { cls: 'b-red', txt: 'Scaduta da ' + (-g) + ' gg' };
  if (g === 0) return { cls: 'b-red', txt: 'Scade oggi!' };
  if (g <= 7) return { cls: 'b-orange', txt: g === 1 ? 'Domani' : 'Tra ' + g + ' gg' };
  if (g <= 30) return { cls: 'b-yellow', txt: 'Tra ' + g + ' gg' };
  return { cls: 'b-grey', txt: fData(p.scadenza) };
}

function rigaPagamento(p) {

function vistaPagamenti() {
  const anno = oggi().slice(0, 4);
  const aperti = S.pagamenti.filter(p => p.pagata !== 'si');
  const scadute = aperti.filter(p => p.scadenza && giorniA(p.scadenza) < 0);
  const pagateAnno = S.pagamenti.filter(p => p.pagata === 'si' && (p.dataPagamento || p.scadenza || '').slice(0, 4) === anno);
  const tot = l => l.reduce((s, p) => s + numero(p.importo), 0);
  let h = `<div class="calhead"><h2>💶 Bollette e pagamenti</h2><button class="btn small" onclick="apriPagamento()">➕ Nuova</button></div>
  <div class="riepilogo">
    <div class="card"><div class="mini">Da pagare</div><b>${euro(tot(aperti))}</b><div class="mini">${aperti.length} ${aperti.length === 1 ? 'pagamento' : 'pagamenti'}</div></div>
    <div class="card ${scadute.length ? 'rosso' : ''}"><div class="mini">Scadute</div><b>${euro(tot(scadute))}</b><div class="mini">${scadute.length ? scadute.length + ' da sistemare' : 'Nessuna 👍'}</div></div>
    <div class="card"><div class="mini">Pagato nel ${anno}</div><b>${euro(tot(pagateAnno))}</b><div class="mini">${pagateAnno.length} pagamenti</div></div>
  </div>
  <div class="chips">
    ${[['da', '⏳ Da pagare'], ['pagate', '✅ Pagate'], ['tutte', 'Tutte']].map(([k, t]) => `<button class="chip ${S.filtroPag === k ? 'on' : ''}" onclick="S.filtroPag='${k}';render()">${t}</button>`).join('')}
    <select class="chip" onchange="S.catPag=this.value;render()"><option value="">Tutte le categorie</option>${CAT_PAG.map(c => `<option value="${c[0]}" ${S.catPag === c[0] ? 'selected' : ''}>${c[1]} ${c[0]}</option>`).join('')}</select>
  </div>`;
  let lista = S.pagamenti.filter(p => (S.filtroPag === 'tutte' || (S.filtroPag === 'pagate' ? p.pagata === 'si' : p.pagata !== 'si')) && (!S.catPag || catPag(p.categoria)[0] === S.catPag));
  const verso = S.filtroPag === 'da' ? 1 : -1;
  lista.sort((a, b) => ((a.scadenza || '9999') < (b.scadenza || '9999') ? -1 : (a.scadenza || '9999') > (b.scadenza || '9999') ? 1 : 0) * verso);
  if (!lista.length) {
    h += `<div class="card"><div class="empty"><b>${S.pagamenti.length ? '🎉' : '🧾'}</b>${S.pagamenti.length ? (S.filtroPag === 'da' ? 'Niente da pagare. Che sollievo!' : 'Niente qui.') : 'Nessuna bolletta ancora. Aggiungi luce, gas, acqua, mutuo… o importale da una cartella con la chat di Claude.'}</div>
      <div class="azioni"><button class="btn" onclick="apriPagamento()">➕ Aggiungi una bolletta</button></div></div>`;
  } else {
    const gruppi = [];
    lista.forEach(p => {
      const k = p.scadenza ? p.scadenza.slice(0, 7) : 'senza';
      let g = gruppi.find(x => x.k === k);
      if (!g) gruppi.push(g = { k, voci: [] });
      g.voci.push(p);
    });
    gruppi.forEach(g => {
      const titolo = g.k === 'senza' ? 'Senza scadenza' : MESI[+g.k.slice(5) - 1] + ' ' + g.k.slice(0, 4);
      h += `<div class="card"><div class="sp-rep" style="text-transform:capitalize">${titolo} <span class="mini">${euro(tot(g.voci))}</span></div>${g.voci.map(rigaPagamento).join('')}</div>`;
    });
  }
  // Quanto avete speso quest'anno, per categoria
  if (pagateAnno.length) {
    const perCat = {};
    pagateAnno.forEach(p => { const c = catPag(p.categoria)[0]; perCat[c] = (perCat[c] || 0) + numero(p.importo); });
    const massimo = Math.max(...Object.values(perCat), 1);
    h += `<div class="card"><div class="sp-rep">📊 Pagato nel ${anno} per categoria</div>
      ${Object.keys(perCat).sort((a, b) => perCat[b] - perCat[a]).map(c => `<div class="catriga"><span>${catPag(c)[1]} ${esc(c)}</span><b>${euro(perCat[c])}</b></div>${barra(perCat[c] / massimo, catPag(c)[2])}`).join('')}
    </div>`;
  }
  return h;
}

function catAutomatica() {

// Se un pagamento ripetuto viene pagato, prepara il prossimo (se non c'e' gia')
function prossimoPagamento(p) {
  const mesi = parseInt(p.ripeti, 10);
  if (!mesi || !p.scadenza) return null;
  const s = addMesi(p.scadenza, mesi);
  if (S.pagamenti.some(x => x.id !== p.id && norm(x.titolo) === norm(p.titolo) && x.scadenza === s)) return null;
  return {
    titolo: p.titolo, categoria: p.categoria, importo: p.importo, scadenza: s, pagata: '', dataPagamento: '', metodo: p.metodo,
    periodo: '', personaId: p.personaId, ripeti: p.ripeti, files: '[]', note: numero(p.importo) ? 'Importo stimato uguale alla volta prima' : ''
  };
}

async function registraPagamento(p, primaPagata) {
  const r = await api('salva', 'Pagamenti', p);
  const i = S.pagamenti.findIndex(x => x.id === r.obj.id);
  if (i >= 0) S.pagamenti[i] = r.obj; else S.pagamenti.push(r.obj);
  let msg = r.avviso || '';
  if (!primaPagata && r.obj.pagata === 'si') {
    const succ = prossimoPagamento(r.obj);
    if (succ) {
      const r2 = await api('salva', 'Pagamenti', succ);
      S.pagamenti.push(r2.obj);
      msg = msg || 'Pagata ✅ Ho già preparato la prossima: scade il ' + fData(succ.scadenza) + ' 🔁';
    }
  }
  return msg;
}

function salvaPagamento() {
  const p = F.d;
  const primaPagata = (S.pagamenti.find(x => x.id === p.id) || {}).pagata === 'si';
  p.titolo = $('#fTipo').value.trim();
  if (!p.titolo) return toast('Scrivi cosa si paga 🙂');
  p.categoria = personaScelta('gCatPag') || indovinaCatPag(p.titolo);
  p.importo = $('#gImporto').value.trim();
  if (p.importo && !numero(p.importo)) return toast('L\'importo non mi torna: scrivilo tipo 85,40');
  p.scadenza = $('#gScadenza').value;
  p.periodo = $('#gPeriodo').value.trim();
  p.metodo = $('#gMetodo').value;
  p.personaId = personaScelta('fPersona');
  p.ripeti = $('#gRipeti').value;
  p.pagata = $('#gPagata').checked ? 'si' : '';
  p.dataPagamento = p.pagata === 'si' ? ($('#gDataPag').value || oggi()) : '';
  p.note = $('#gNote').value.trim();
  const prima = filesDi(S.pagamenti.find(x => x.id === p.id) || {});
  const ora = new Set(F.files.map(f => f.id));
  const tolti = prima.filter(f => !ora.has(f.id)).concat(F.nuovi.filter(id => !ora.has(id)).map(id => ({ id })));
  p.files = JSON.stringify(F.files);
  const btn = $('#gSalva'); btn.disabled = true; btn.textContent = 'Un attimo… ⏳';
  registraPagamento(p, primaPagata).then(msg => {
    tolti.forEach(f => api('cestinaFile', f.id).catch(() => {}));
    F = null; chiudiFinestra(); render();
    toast(msg || (p.pagata === 'si' ? 'Segnata come pagata ✅' : 'Salvata ✅' + (p.scadenza ? ' Avviso nel calendario 📅' : '')), 4000);
  }).catch(e => { btn.disabled = false; btn.textContent = '💾 Salva'; errore(e); });
}

function segnaPagata(id) {
  const p = Object.assign({}, S.pagamenti.find(x => x.id === id));
  p.pagata = 'si'; p.dataPagamento = oggi();
  toast('Segno come pagata… ⏳', 20000);
  registraPagamento(p, false).then(msg => { render(); toast(msg || 'Pagata ✅ Tolto l\'avviso dal calendario', 4000); }).catch(errore);
}

function eliminaPagamento(id) {
  chiedi('Cancello questo pagamento?', 'Sparisce anche l\'avviso dal calendario e la copia della bolletta dalla cartella dell\'app.').then(si => {
    if (!si) return;
    api('elimina', 'Pagamenti', id).then(() => { S.pagamenti = S.pagamenti.filter(x => x.id !== id); F = null; chiudiFinestra(); render(); toast('Cancellato 👋'); }).catch(errore);

}

function apriFinestra(html) {
  chiudiFinestra();
  const v = document.createElement('div'); v.className = 'velo'; v.id = 'velo';
  v.innerHTML = `<div class="sheet">${html}</div>`;
  v.addEventListener('click', e => { if (e.target === v) { F ? annullaDocumento() : chiudiFinestra(); } });
  document.body.appendChild(v);
}
function chiudiFinestra() { const v = $('#velo'); if (v) v.remove(); }
function chiedi(titolo, testo) {
  return new Promise(ok => {
    const v = document.createElement('div'); v.className = 'velo'; v.style.zIndex = 70;
    v.innerHTML = `<div class="sheet"><h3>${esc(titolo)}</h3><p>${esc(testo)}</p><div class="azioni"><button class="btn sec" id="cNo">No, lascia stare</button><button class="btn danger" id="cSi">Sì</button></div></div>`;
    document.body.appendChild(v);
    v.querySelector('#cNo').onclick = () => { v.remove(); ok(false); };
    v.querySelector('#cSi').onclick = () => { v.remove(); ok(true); };
  });
}
